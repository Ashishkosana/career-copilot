<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>career-copilot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafafa;--panel:#fff;--line:#ececf0;--tx:#111214;--tx2:#6b7280;--tx3:#9ca3af;--dark:#18181b;--sb:236px}
@media(prefers-color-scheme:dark){:root{--bg:#0c0d0f;--panel:#141619;--line:#23262c;--tx:#e9eaec;--tx2:#9ca3af;--tx3:#6b7280;--dark:#e9eaec}}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}

aside{width:var(--sb);flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 22px;font-weight:640;font-size:15px;letter-spacing:-.02em}
.mark{width:24px;height:24px;border-radius:7px;background:var(--dark);color:var(--panel);display:flex;
      align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.slab{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);padding:0 8px 8px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;
     color:var(--tx2);cursor:pointer;margin-bottom:2px;font-weight:500;white-space:nowrap}
.nav:hover{background:var(--bg);color:var(--tx)}
.nav.on{background:var(--bg);color:var(--tx);font-weight:600;box-shadow:inset 2px 0 0 var(--dark)}
.nav .ic{width:15px;text-align:center;opacity:.6;flex-shrink:0}
.grow{flex:1}
.me{background:var(--dark);border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:10px;color:var(--panel)}
.av{width:32px;height:32px;border-radius:50%;background:rgba(128,128,128,.35);display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:640;flex-shrink:0}
.me small{display:block;opacity:.62;font-size:11.5px}

main{flex:1;min-width:0;padding:0 clamp(16px,3vw,34px) 70px}
.top{display:flex;align-items:center;gap:14px;padding:20px 0 24px;position:sticky;top:0;
     background:var(--bg);z-index:20;flex-wrap:wrap}
h1{font-size:clamp(18px,2.4vw,21px);font-weight:640;letter-spacing:-.025em}
.burger{display:none;background:var(--panel);border:1px solid var(--line);color:var(--tx);
        border-radius:9px;width:36px;height:36px;font-size:16px;cursor:pointer;flex-shrink:0}
.srch{flex:1;min-width:180px;max-width:430px;position:relative}
.srch input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
            padding:9px 13px 9px 34px;font:inherit;font-size:13px;outline:none;color:var(--tx)}
.srch input:focus{border-color:var(--tx3)}
.srch span{position:absolute;left:12px;top:9px;color:var(--tx3);font-size:13px}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 14px;gap:12px;flex-wrap:wrap}
.sec h3{font-size:15px;font-weight:620;letter-spacing:-.015em}
.mut{color:var(--tx3);font-size:12.5px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;margin-bottom:26px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.st b{display:block;font-size:clamp(19px,2.6vw,23px);font-weight:660;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.st span{font-size:11.5px;color:var(--tx3)}
.st.ok b{color:#16a34a}

.note{background:rgba(245,199,110,.11);border:1px solid rgba(245,199,110,.35);border-radius:11px;
      padding:13px 15px;font-size:12.5px;color:var(--tx2);margin-bottom:26px;line-height:1.6}
.note b{color:var(--tx);font-weight:640}
.note code{font-size:11.5px;background:rgba(128,128,128,.16);padding:1px 5px;border-radius:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:30px}
.card{border-radius:14px;padding:15px 16px;min-height:114px;display:flex;flex-direction:column;
      justify-content:space-between;cursor:pointer;transition:.14s;color:#14161a}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.10)}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .co{font-size:11.5px;opacity:.58;margin-bottom:3px}
.card .ti{font-size:13.5px;font-weight:620;line-height:1.35;letter-spacing:-.01em}
.card .mt{font-size:11px;opacity:.55;margin-top:8px}
.pct{width:40px;height:40px;position:relative;flex-shrink:0}
.pct svg{transform:rotate(-90deg)}
.pctx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}

.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.ch{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    font-size:12.5px;color:var(--tx2);cursor:pointer;user-select:none;white-space:nowrap}
.ch.on{background:var(--dark);color:var(--panel);border-color:var(--dark);font-weight:560}

.tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:1fr 108px 122px 128px 88px;align-items:center;gap:12px;padding:12px 18px}
.th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);
    border-bottom:1px solid var(--line);font-weight:600}
.tr{border-bottom:1px solid var(--line);font-size:13.5px}
.tr:last-child{border:0}
.tr:hover{background:var(--bg)}
.cell1{display:flex;align-items:center;gap:11px;min-width:0}
.ico{width:29px;height:29px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
     justify-content:center;font-size:12px;font-weight:660;color:#fff}
.n1{font-weight:570;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.n1 a{color:inherit;text-decoration:none}.n1 a:hover{text-decoration:underline}
.n2{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab{font-size:10px;padding:1.5px 6px;border-radius:4px;margin-left:6px;font-weight:600;vertical-align:1px}
.l-out{background:rgba(244,63,94,.14);color:#e11d48}
.l-thin{background:rgba(245,158,11,.14);color:#b45309}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:560;padding:4px 10px;border-radius:999px}
.d{width:6px;height:6px;border-radius:50%}
.s-q{background:rgba(245,158,11,.14);color:#b45309}.s-q .d{background:#f59e0b}
.s-n{background:rgba(59,130,246,.14);color:#1d4ed8}.s-n .d{background:#3b82f6}
.s-a{background:rgba(128,128,128,.14);color:var(--tx3)}.s-a .d{background:var(--tx3)}
.k{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}

/* ---- responsive ---- */
@media(max-width:1000px){
  .th,.tr{grid-template-columns:1fr 110px 120px}
  .th span:nth-child(2),.tr>div:nth-child(2),
  .th span:nth-child(5),.tr>div:nth-child(5){display:none}
}
@media(max-width:760px){
  aside{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menu aside{transform:none}
  body.menu .scrim{display:block}
  .burger{display:block}
  main{padding:0 16px 60px}
  .th{display:none}
  .tr{grid-template-columns:1fr;gap:9px;padding:14px 16px;align-items:start}
  .tr>div:nth-child(2){display:none}
  .tr>div:nth-child(3),.tr>div:nth-child(5){display:block;font-size:12px}
  .k{display:inline;color:var(--tx3);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-right:7px}
  .cards{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
}
@media(max-width:440px){.cards{grid-template-columns:1fr}}
</style></head><body>

</main></div>

      <div><span class="stat ${c}"><span class="d"></span>${l}</span></div>
      <div class="mut"><span class="k">Posted</span>${ago(i.postedAt)} ago</div></div>`;
  }).join('');
}
document.querySelectorAll('.ch').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.ch').forEach(x=>x.classList.toggle('on',x===c));F.v=c.dataset.v;render();});
document.getElementById('q').oninput=e=>{F.q=e.target.value;render();};
render();
</script></body></html>
