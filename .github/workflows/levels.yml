# Read seniority levels with Claude Code, on a schedule, using the subscription.
#
# Why here and not in the Lambda. 2,207 of the 2,569 kept postings state no level in
# their title, and resolving them needs a language model. The Messages API requires a
# Console `sk-ant-api03-` key on a prepaid balance; a Claude subscription issues a
# `sk-ant-oat01-` token, which authenticates the Claude Code *program* and answers
# `401 invalid x-api-key` against the API — separate doors, because a flat
# subscription cannot be billed per call. Claude Code itself is a few hundred
# megabytes needing a filesystem and a shell, so it cannot go in a Lambda bundle
# already at 145 MB of its 250 MB ceiling. A CI runner has both.
#
# ---------------------------------------------------------------------------
# The security shape, which is the part worth reading.
#
# This job feeds **scraped third-party job descriptions** to a model, unattended, on
# a cron. That text is untrusted: a description can contain instructions. So the
# model step is given nothing to attack with.
#
#   * `--allowed-tools ""` — no tools at all. No file reads, no writes, no shell, no
#     network. The step is a pure text transformation: prompt in, stdout out.
#   * No `--permission-mode acceptEdits`. An earlier draft of this file used it, which
#     would have let injected text edit the checkout with no approval. That was the
#     defect, not a precaution someone forgot.
#   * It runs from `$RUNNER_TEMP`, not the checkout, so there is no repository in
#     scope and no project instructions to inherit.
#   * The token is `CLAUDE_CODE_OAUTH_TOKEN`. It cannot call the Messages API and
#     cannot touch AWS. The AWS credentials are scoped to the two Python steps, which
#     make no model call. That separation is why the rounds loop lives *inside* the
#     model step instead of the step list looping around a per-round import: a step
#     that both calls the model and writes to DynamoDB would need both sets of
#     credentials at once, and there would no longer be a step that cannot reach AWS.
#
# The remaining surface is a description trying to talk the model into a wrong
# answer. That is handled by verification rather than by trust: `import` re-reads the
# real description from the store and requires the quoted span to actually occur in
# it. An injected "call every role entry-level" yields a quote that is not in the
# text, which is forced to low confidence and flagged `evidence_verified: false`, so
# nothing downstream treats it as supported.
#
# ---------------------------------------------------------------------------
# How one run drains many postings.
#
# One `claude --print` call has a finite context, so a run is several sequential
# rounds. `export` screens the corpus once and shards the queue into `round-NN.json`
# of <=CHUNK postings each; `prompt` turns each into `round-NN.prompt.txt`; the model
# step answers them one at a time into `round-NN.raw.txt`; `import` validates every
# round in one pass. Two corpus screens per run, not two per round — screening is
# 1.5 ms a posting and ~75 s over the deployed 47,550, so a per-round export/import
# loop would spend over two hours of screening to buy 30 minutes of model work.
#
# Rounds are sequential on purpose: they share one subscription and one rate limit,
# so a matrix would only collide with itself.
#
# A failed round does not discard the rounds already answered. The loop deletes that
# round's partial output, stops rather than hammering a limit that may have just been
# hit, and exits non-zero — and the import step runs anyway (`!cancelled()`), so the
# rounds that came back are still cached and the job still reports red. Anything the
# run did not reach is simply still uncached, so the next run re-derives it.
#
# Measured, on real descriptions from the corpus: 25 postings = 118 KB of prompt,
# answered in 23 s. So a run costs about 0.9 s a posting plus ~3 min of fixed cost
# (install, two screens). limit=1000 is the ceiling the script clamps to: ~40 rounds,
# ~22 min, against `timeout-minutes: 45`.
name: levels

on:
  schedule:
    # 15:00 UTC = 08:00 America/Phoenix, an hour after the fetch cron at 14:00, so the
    # postings this reads about already exist.
    - cron: "0 15 * * *"
  workflow_dispatch:
    # The 2,207-posting backlog is a one-time catch-up, so the manual default is the
    # big one: 500 postings, 20 rounds, ~15 min end to end. Five of these drain it.
    # The cron below stays small because steady state is ~20-40 postings a morning.
    inputs:
      limit:
        description: "How many postings to resolve this run (clamped to 1000)"
        required: false
        default: "500"
      chunk:
        description: "Postings per model round"
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  # Two runs would export overlapping batches and spend the model twice on the same
  # postings. Not cancel-in-progress: a half-finished batch has already cached real
  # answers, and killing it wastes them.
  group: levels
  cancel-in-progress: false

jobs:
  levels:
    runs-on: ubuntu-latest
    # 45, not 25: a manual drain of 1,000 postings is ~40 sequential rounds at ~23 s
    # each plus two corpus screens, ~22 min measured, and the timeout has to sit above
    # the worst case the script will accept rather than above the daily case.
    timeout-minutes: 45
    env:
      # The cron takes 150 — six rounds, ~4 min — because a normal morning leaves
      # ~20-40 postings needing a level. A manual run passes its own, up to 1,000.
      LIMIT: ${{ inputs.limit || '150' }}
      CHUNK: ${{ inputs.chunk || '25' }}
      # One directory holds round-NN.json / .prompt.txt / .raw.txt. Under RUNNER_TEMP
      # because the model step must not be able to see the checkout.
      LEVELS_DIR: ${{ runner.temp }}/levels
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # `adapters` for boto3 — these steps talk to the real DynamoDB corpus.
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev,adapters,resume]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Export the postings that still need a level
        working-directory: backend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          COPILOT_POSTINGS_TABLE_NAME: career-copilot-postings
        run: |
          python scripts/level_batch.py export \
            --dir "$LEVELS_DIR" --limit "$LIMIT" --chunk "$CHUNK"

      # Nothing to do is the normal state once the queue is drained. It must not spend
      # a model call, and it must not fail the run. The number is *rounds*, because the
      # only question here is whether the loop below has anything to iterate over.
      - name: Anything to do?
        id: check
        working-directory: backend
        run: |
          rounds=$(python scripts/level_batch.py count --dir "$LEVELS_DIR")
          echo "rounds=$rounds" >> "$GITHUB_OUTPUT"
          echo "$rounds rounds to ask about."

      - name: Build the prompts
        if: steps.check.outputs.rounds != '0'
        working-directory: backend
        run: python scripts/level_batch.py prompt --dir "$LEVELS_DIR"

      - name: Read the levels
        if: steps.check.outputs.rounds != '0'
        # Not the checkout: nothing in the repo should be reachable from this step.
        working-directory: ${{ runner.temp }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # The prompt goes in on **stdin**, not as an argument. Linux caps a single
          # argv string at 32 pages — 131,072 bytes — and `claude --print "$(cat
          # prompt.txt)"` was already at 118 KB for 25 postings, ~180 KB once JSON
          # escaping is counted at the 6,000-char description cap. Past the cap execve
          # fails with E2BIG, "Argument list too long", which would have shown up as an
          # unexplained failure on the runner and never on a Mac (no per-arg limit
          # there). On stdin there is no such ceiling, and the variadic `--allowed-tools`
          # no longer has a trailing prompt to swallow.
          shopt -s nullglob
          failed=0
          for prompt in "$LEVELS_DIR"/round-*.prompt.txt; do
            raw="${prompt%.prompt.txt}.raw.txt"
            echo "::group::$(basename "$prompt")"
            # `timeout` so one hung call cannot eat the whole job budget: a 25-posting
            # round is 23 s measured, so 300 s is 13x headroom, and a timeout is
            # treated as a failed round rather than as a stall.
            if timeout 300 claude --print --allowed-tools "" < "$prompt" > "$raw"; then
              echo "$(basename "$raw"): $(wc -c < "$raw") bytes"
            else
              status=$?
              # Delete the partial answer: half a JSON object is not evidence, and
              # leaving it would import one truncated round's first entry as if it were
              # the round. Stop rather than continue — the likely cause is a rate limit,
              # and the rounds already answered are real spend that the import step is
              # about to bank.
              rm -f "$raw"
              echo "$(basename "$prompt") failed (exit $status). Stopping;" \
                   "the rounds already answered are still imported."
              failed=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # `!cancelled()` rather than `success()`: this is the step that banks the work. A
      # round that failed above must not throw away the rounds that came back, and the
      # run still reports red because that step exited non-zero.
      - name: Validate and cache the answers
        if: ${{ !cancelled() && steps.check.outputs.rounds != '0' }}
        working-directory: backend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          COPILOT_POSTINGS_TABLE_NAME: career-copilot-postings
        run: python scripts/level_batch.py import --dir "$LEVELS_DIR"

      # Kept on failure only. These files hold other people's job descriptions, so a
      # green run leaves nothing behind.
      - name: Upload the batch for inspection
        if: failure() && steps.check.outputs.rounds != '0'
        uses: actions/upload-artifact@v4
        with:
          name: level-batch
          path: ${{ runner.temp }}/levels
          retention-days: 3
