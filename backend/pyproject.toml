[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot"
version = "2.0.0"
description = "Personal job-search agent — one daily briefing, on AWS serverless + Google Cloud."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Cloud/Google adapters — only imported by the adapter layer, never the domain.
adapters = [
  "anthropic>=0.40",
  "boto3>=1.34",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
]
# scripts/tailor.py verifies a built PDF's text layer. Local-only tooling — Lambda has
# no browser — but declared so the type gate sees the same imports everywhere. Left out,
# CI could not resolve them and mypy failed on a PR that passed locally.
resume = [
  "pdfplumber>=0.11",
  "pypdf>=6.0",
]
dev = [
  "pytest>=8.2",
  # Pinned exactly, not `>=`. CI installs from this file and ran a *newer* ruff
  # than the local venv, so `ruff check` passed locally and failed on the PR with
  # RUF036 — a rule the local build did not have. A lint gate that disagrees with
  # itself across machines is not a gate; it is a coin flip you notice in review.
  # Bump these deliberately and fix the fallout in that commit.
  "ruff==0.16.1",
  "mypy==2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PL"]
ignore = ["PLR0913"]  # allow richer function signatures in orchestration

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values in assertions are fine in tests
# Job descriptions genuinely contain en dashes ("3–5 years") and curly
# apostrophes ("years' experience"); the patterns must match the real characters.
"src/copilot/domain/seniority.py" = ["RUF001", "RUF003"]
# Résumé prose really contains curly apostrophes; the word pattern must match them.
"src/copilot/domain/tailoring.py" = ["RUF001"]
# Report scripts are long straight-line printing; splitting them hurts readability.
"scripts/**" = ["PLR0915"]
# Adapters lazy-import their cloud/vendor SDK inside the method that needs it, so
# importing the package never drags in boto3/google or requires credentials.
"src/copilot/adapters/*" = ["PLC0415"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
# The gate is `mypy src tests scripts`, not `mypy src`. Checking only the package
# left 37 strict errors in the test suite, and two of them were real: a `FakeStore`
# that did not satisfy `StorePort` (so it proved less than it looked like it did),
# and an attack list typed `object` whose callables were never checked at the call
# site. A test double that does not type-check against the port it doubles is the
# one place a type error costs you the thing types were bought for.
files = ["src", "tests", "scripts"]

# Cloud/Google SDKs ship no (complete) type stubs; the adapter layer imports them
# lazily and keeps their return values behind typed boundaries.
[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "googleapiclient.*",
  "google.*",
  "google_auth_oauthlib.*",
  "pdfplumber.*",
  "pypdf.*",
]
ignore_missing_imports = true
# Note what this does *not* cover, because it cost a red PR. `ignore_missing_imports`
# only applies when the import is **missing**. Without google-auth installed, the name
# resolves to `Any` and calling it is fine; *with* google-auth installed — it ships no
# `py.typed` — the import succeeds as untyped and strict mode's `disallow_untyped_calls`
# fires at the call site. Same source, same mypy, same config, different answer purely
# because CI installs the `adapters` extra and the local venv had not: the local gate was
# weaker for having *fewer* packages, which is the opposite of the intuition.
#
# The fix is at the call site, not here. mypy's per-module options apply to the module
# being **checked**, so `disallow_untyped_calls = false` in this block would govern
# google's own files, not our calls into them. See gmail_mailbox.py:202.

[tool.pytest.ini_options]
# `scripts` is importable so the batch route can be tested rather than only run.
# It is the one script carrying real logic — it decides what a model is asked and
# whether its answer is trustworthy — and that belongs under test, not under review.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-q"
